<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'">
<title>押金查询 · 摄影器材租赁</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>摄影器材租赁 · 押金查询</h1>
    <p>输入订单号与下单手机号，查询押金金额、归还状态、设备清单与退款进度。</p>
  </div>

  <div class="card">
    <form id="q-form">
      <div class="row">
        <div>
          <label for="order_no">订单号</label>
          <input id="order_no" name="order_no" autocomplete="off" maxlength="24" placeholder="例如 RC260929K7QX4M2A" required>
        </div>
        <div>
          <label for="phone">下单手机号</label>
          <input id="phone" name="phone" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="11 位手机号" required>
        </div>
      </div>
      <div style="margin-top:16px">
        <button type="submit" id="q-btn">查询押金</button>
      </div>
      <p class="muted" style="margin:12px 0 0">订单号与手机号必须同时匹配，连续查询失败将被暂时限制。</p>
    </form>
    <div id="msg"></div>
  </div>

  <div id="result" class="hide"></div>
</div>
<script src="/assets/app.js"></script>
</body>
</html>
